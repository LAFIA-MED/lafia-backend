name: Deploy to EC2

on:
  push:
    branches:
      - production # <- you deploy from 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (not used on server, but fine to keep)
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/html/lafia-backend

            git config --global --add safe.directory /var/www/html/lafia-backend

            git fetch --all --prune
            git reset --hard origin/production

            if command -v pnpm >/dev/null 2>&1; then
              pnpm install --frozen-lockfile
              pnpm run build
            else
              npm ci
              npm run build
            fi

            if pm2 list | grep -q "lafia-backend"; then
              pm2 reload lafia-backend --update-env
            else
              pm2 start dist/main.js --name lafia-backend
            fi

            pm2 save
